decisions:
  - id: dec-devolucion-buzon
    statement: "Un libro dejado en el buzón está devuelto el día que cayó, aunque se registre al día siguiente"
    speakers: [sp-rosa, sp-tomas]
    why: "El socio no puede pagar multa por un día en que el libro ya estaba en la biblioteca"
    alternatives_rejected:
      - option: "Devuelto recién cuando se registra"
        why_not: "Cobra al socio un día que no le corresponde"
    refs: [gl-devolucion, hs-devolucion-buzon]
    level: process
    decided_on: "2026-09-15"
    status: confirmado
    provenance: {kind: respuesta, question: "¿Los dos aceptan que quede devuelto el día que cayó?", answer: "Sí (Rosa). Sí (Tomás)"}
  - id: dec-plazo-corridos
    statement: "Los 14 días del préstamo son corridos"
    speakers: [sp-rosa]
    why: "Así se hizo siempre y así lo dice el reglamento de socios"
    alternatives_asked: {words: "No, nunca se pensó en hábiles: siempre fueron corridos", speaker: sp-rosa}
    refs: [hs-plazo, ev-prestamo-vencido]
    level: process
    decided_on: "2026-09-14"
    status: confirmado
    provenance: {kind: respuesta, question: "¿Se consideró alguna vez contar solo días hábiles?", answer: "No, nunca se pensó en hábiles: siempre fueron corridos"}
  - id: dec-flujos-v1
    statement: "En Process se recorren el préstamo y la reserva"
    speakers: [sp-rosa]
    why: "Son las dos historias del mostrador"
    alternatives_rejected:
      - option: "Recorrer también el alta de ejemplares"
        why_not: "Es de catálogo; Tomás no estaba ese día"
    refs: [fl-prestamo, fl-reserva]
    level: process
    decided_on: "2026-09-12"
    status: confirmado
    provenance: {kind: respuesta, question: "¿Qué historias recorremos en detalle?", answer: "El préstamo y la reserva"}
  - id: dec-flujos-v2
    statement: "En Process se recorren el préstamo con sus dos fallas y el alta de ejemplares; la reserva queda fuera"
    speakers: [sp-rosa, sp-tomas]
    why: "La reserva casi no se usa; el alta de ejemplares es lo que Tomás necesita ver"
    alternatives_rejected:
      - option: "Seguir con la reserva"
        why_not: "Hoy casi nadie reserva; primero lo que pasa todos los días"
    refs: [fl-prestamo, fl-prestamo-rechazado, fl-vencimiento, fl-catalogacion]
    supersedes: dec-flujos-v1
    level: process
    decided_on: "2026-09-13"
    status: confirmado
    provenance: {kind: respuesta, question: "Ahora que está Tomás, ¿qué recorremos?", answer: "El préstamo con lo que sale mal, y el alta de ejemplares (Rosa). Sí (Tomás)"}

