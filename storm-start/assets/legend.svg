<svg xmlns="http://www.w3.org/2000/svg" width="768" height="700" viewBox="0 0 768 700" role="img" aria-label="Leyenda del tablero de Event Storming: Evento, Comando, Política, Actor, Agregado, Vista, Sistema externo, Punto caliente, Oportunidad, Decisión; Hipótesis sin autor, Disputado, Evento pivote, Camino de falla, No se sabe" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Leyenda del tablero de Event Storming: Evento, Comando, Política, Actor, Agregado, Vista, Sistema externo, Punto caliente, Oportunidad, Decisión; Hipótesis sin autor, Disputado, Evento pivote, Camino de falla, No se sabe</title>
<rect x="0" y="0" width="768" height="700" rx="12" fill="#f6f4ef" stroke="#d9d4c9"/>
<text x="24" y="38" font-size="15" font-weight="700" fill="#1f1d1a">Tipos de nota</text>
<rect x="24" y="55" width="168" height="104" rx="3" fill="#000000" fill-opacity=".12"/><rect x="24" y="54" width="168" height="104" rx="3" fill="#ff9f43"/><text x="34" y="74" font-size="13" font-weight="600" fill="#1d1b16">Evento</text><text x="34" y="94" font-size="11" font-weight="400" fill="#1d1b16">Algo que pasó en el</text><text x="34" y="108" font-size="11" font-weight="400" fill="#1d1b16">dominio, en pasado</text>
<rect x="208" y="55" width="168" height="104" rx="3" fill="#000000" fill-opacity=".12"/><rect x="208" y="54" width="168" height="104" rx="3" fill="#6fa8ff"/><text x="218" y="74" font-size="13" font-weight="600" fill="#1d1b16">Comando</text><text x="218" y="94" font-size="11" font-weight="400" fill="#1d1b16">Una intención de</text><text x="218" y="108" font-size="11" font-weight="400" fill="#1d1b16">alguien: lo que se pide</text><text x="218" y="122" font-size="11" font-weight="400" fill="#1d1b16">que pase</text>
<rect x="392" y="55" width="168" height="104" rx="3" fill="#000000" fill-opacity=".12"/><rect x="392" y="54" width="168" height="104" rx="3" fill="#c9a7f5"/><text x="402" y="74" font-size="13" font-weight="600" fill="#1d1b16">Política</text><text x="402" y="94" font-size="11" font-weight="400" fill="#1d1b16">Cada vez que X, entonces</text><text x="402" y="108" font-size="11" font-weight="400" fill="#1d1b16">Y</text>
<rect x="576" y="55" width="120" height="72" rx="3" fill="#000000" fill-opacity=".12"/><rect x="576" y="54" width="120" height="72" rx="3" fill="#fff4b0"/><text x="586" y="74" font-size="11" font-weight="600" fill="#1d1b16">Actor</text><text x="586" y="90" font-size="9" font-weight="400" fill="#1d1b16">Quién da la orden</text>
<rect x="24" y="175" width="168" height="104" rx="3" fill="#000000" fill-opacity=".12"/><rect x="24" y="174" width="168" height="104" rx="3" fill="#ffd84d"/><text x="34" y="194" font-size="13" font-weight="600" fill="#1d1b16">Agregado</text><text x="34" y="214" font-size="11" font-weight="400" fill="#1d1b16">Lo que protege las</text><text x="34" y="228" font-size="11" font-weight="400" fill="#1d1b16">reglas que nunca se</text><text x="34" y="242" font-size="11" font-weight="400" fill="#1d1b16">rompen</text>
<rect x="208" y="175" width="168" height="104" rx="3" fill="#000000" fill-opacity=".12"/><rect x="208" y="174" width="168" height="104" rx="3" fill="#7ed98b"/><text x="218" y="194" font-size="13" font-weight="600" fill="#1d1b16">Vista</text><text x="218" y="214" font-size="11" font-weight="400" fill="#1d1b16">Lo que alguien mira para</text><text x="218" y="228" font-size="11" font-weight="400" fill="#1d1b16">decidir</text>
<rect x="392" y="175" width="168" height="104" rx="3" fill="#000000" fill-opacity=".12"/><rect x="392" y="174" width="168" height="104" rx="3" fill="#ffa8d0"/><text x="402" y="194" font-size="13" font-weight="600" fill="#1d1b16">Sistema externo</text><text x="402" y="214" font-size="11" font-weight="400" fill="#1d1b16">Algo fuera del alcance</text><text x="402" y="228" font-size="11" font-weight="400" fill="#1d1b16">que dispara o recibe</text>
<rect x="576" y="175" width="168" height="104" rx="3" fill="#000000" fill-opacity=".12"/><rect x="576" y="174" width="168" height="104" rx="3" fill="#e8246f"/><text x="586" y="194" font-size="13" font-weight="600" fill="#ffffff">Punto caliente</text><text x="586" y="214" font-size="11" font-weight="400" fill="#ffffff">Duda, conflicto o</text><text x="586" y="228" font-size="11" font-weight="400" fill="#ffffff">ambigüedad sin resolver</text>
<rect x="24" y="295" width="168" height="104" rx="3" fill="#000000" fill-opacity=".12"/><rect x="24" y="294" width="168" height="104" rx="3" fill="#c8f2c0"/><text x="34" y="314" font-size="13" font-weight="600" fill="#1d1b16">Oportunidad</text><text x="34" y="334" font-size="11" font-weight="400" fill="#1d1b16">Algo que se podría</text><text x="34" y="348" font-size="11" font-weight="400" fill="#1d1b16">mejorar</text>
<rect x="208" y="295" width="168" height="104" rx="3" fill="#000000" fill-opacity=".12"/><rect x="208" y="294" width="168" height="104" rx="3" fill="#ffffff"/><rect x="209.5" y="295.5" width="165" height="101" rx="3" fill="none" stroke="#1d1b16" stroke-width="3"/><text x="218" y="314" font-size="13" font-weight="600" fill="#1d1b16">Decisión</text><text x="218" y="334" font-size="11" font-weight="400" fill="#1d1b16">Una elección con autor,</text><text x="218" y="348" font-size="11" font-weight="400" fill="#1d1b16">motivo y alternativas</text><text x="218" y="362" font-size="11" font-weight="400" fill="#1d1b16">descartadas</text>
<text x="24" y="436" font-size="15" font-weight="700" fill="#1f1d1a">Estados y marcas</text>
<rect x="24" y="453" width="168" height="104" rx="3" fill="#000000" fill-opacity=".12"/><rect x="24" y="452" width="168" height="104" rx="3" fill="#ff9f43"/><rect x="25.5" y="453.5" width="165" height="101" rx="3" fill="none" stroke="#1d1b16" stroke-width="3" stroke-dasharray="3 3"/><text x="34" y="472" font-size="13" font-weight="600" fill="#1d1b16">Hipótesis sin autor</text><text x="34" y="492" font-size="11" font-weight="400" fill="#1d1b16">Nadie la adoptó todavía;</text><text x="34" y="506" font-size="11" font-weight="400" fill="#1d1b16">no cuenta como modelo</text>
<rect x="208" y="453" width="168" height="104" rx="3" fill="#000000" fill-opacity=".12"/><rect x="208" y="452" width="168" height="104" rx="3" fill="#ff9f43"/><rect x="208.5" y="452.5" width="167.0" height="103.0" rx="3" fill="none" stroke="#1d1b16" stroke-width="1"/><rect x="210.5" y="454.5" width="163.0" height="99.0" rx="3" fill="none" stroke="#1d1b16" stroke-width="1"/><text x="218" y="472" font-size="13" font-weight="600" fill="#1d1b16">Disputado</text><text x="218" y="492" font-size="11" font-weight="400" fill="#1d1b16">Dos voces lo dicen</text><text x="218" y="506" font-size="11" font-weight="400" fill="#1d1b16">distinto; tiene un punto</text><text x="218" y="520" font-size="11" font-weight="400" fill="#1d1b16">caliente abierto</text>
<rect x="392" y="453" width="168" height="104" rx="3" fill="#000000" fill-opacity=".12"/><rect x="392" y="452" width="168" height="104" rx="3" fill="#ff9f43"/><rect x="392" y="452" width="9" height="104" fill="#1d1b16"/><text x="411" y="472" font-size="13" font-weight="600" fill="#1d1b16">Evento pivote</text><text x="411" y="492" font-size="11" font-weight="400" fill="#1d1b16">Después de este evento</text><text x="411" y="506" font-size="11" font-weight="400" fill="#1d1b16">cambia todo lo que</text><text x="411" y="520" font-size="11" font-weight="400" fill="#1d1b16">sigue</text>
<rect x="576" y="452" width="4" height="104" fill="#c0392b"/>
<text x="590" y="472" font-size="13" font-weight="600" fill="#c0392b">Camino de falla</text>
<text x="590" y="492" font-size="11" font-weight="400" fill="#6b665d">Lo que pasa cuando el</text><text x="590" y="506" font-size="11" font-weight="400" fill="#6b665d">flujo principal sale mal</text>
<rect x="24" y="573" width="168" height="104" rx="3" fill="#000000" fill-opacity=".12"/><rect x="24" y="572" width="168" height="104" rx="3" fill="#ff9f43"/><text x="34" y="592" font-size="13" font-weight="600" fill="#1d1b16">No se sabe</text><text x="34" y="612" font-size="11" font-weight="400" fill="#1d1b16">El campo apunta a un</text><text x="34" y="626" font-size="11" font-weight="400" fill="#1d1b16">desconocido; se lista en</text><text x="34" y="640" font-size="11" font-weight="400" fill="#1d1b16">«Lo que no se sabe»</text><rect x="34" y="652" width="86" height="16" rx="8" fill="#e8246f"/><text x="40" y="664" font-size="10.5" font-weight="600" fill="#ffffff">? no se sabe</text>
</svg>
